#file: noinspection SpellCheckingInspection
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # The codeql-action sub-actions (init/analyze/autobuild/upload-sarif) must
      # all run the same version; bumping them in separate PRs makes each PR fail
      # with "Loaded a configuration file for version X, but running version Y".
      codeql-action:
        patterns:
          - "github/codeql-action*"
